services:
  - type: web
    name: voiceshield-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: APP_NAME
        value: VoiceShield-AI
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: voiceshield-db
          property: connectionString

databases:
  - name: voiceshield-db
    plan: free
    region: oregon
