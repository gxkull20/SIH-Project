services:
  - type: web
    name: voiceshield-backend
    runtime: python
    plan: free
    region: oregon
    # Build from repo root so ml/ shared module is accessible alongside backend/
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: APP_NAME
        value: VoiceShield-AI
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: voiceshield-db
          property: connectionString

databases:
  - name: voiceshield-db
    plan: free
    region: oregon
